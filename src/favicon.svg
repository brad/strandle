<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark background container -->
  <rect width="512" height="512" rx="112" fill="#121213"/>

  <!-- 2x2 grid of letter tiles -->
  <!-- Top-Left (Green 'S') -->
  <rect x="56" y="56" width="180" height="180" rx="36" fill="#6aaa64"/>
  <text x="146" y="156" dominant-baseline="central" text-anchor="middle" fill="#111111" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="120">S</text>

  <!-- Top-Right (Gold 'T') -->
  <rect x="276" y="56" width="180" height="180" rx="36" fill="#c9b458"/>
  <text x="366" y="156" dominant-baseline="central" text-anchor="middle" fill="#111111" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="120">T</text>

  <!-- Bottom-Left (Dark/Gray 'A') -->
  <rect x="56" y="276" width="180" height="180" rx="36" fill="#2c2c2e"/>
  <text x="146" y="376" dominant-baseline="central" text-anchor="middle" fill="#e8e8e8" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="120">A</text>

  <!-- Bottom-Right (Blue/Spangram Green 'R') -->
  <rect x="276" y="276" width="180" height="180" rx="36" fill="#a3cf62"/>
  <text x="366" y="376" dominant-baseline="central" text-anchor="middle" fill="#111111" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="120">R</text>

  <!-- Blue strand tracing path forming an S path: Top Right -> Top Left -> Bottom Right -> Bottom Left -->
  <path d="M 366 146 L 146 146 L 366 366 L 146 366" stroke="#85c0ed" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
</svg>
